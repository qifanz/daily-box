name: Weekly Auto-Generate Knowledge Cards

on:
  schedule:
    # Every Monday at 00:00 UTC (08:00 Beijing Time)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate 10 new weekly knowledge cards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node scripts/generate-weekly-cards.mjs

      - name: Commit & push updated auto-cards
        id: git_push
        run: |
          if git diff --quiet data/auto-cards.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to data/auto-cards.js"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/auto-cards.js
            git commit -m "chore(cards): auto-append weekly knowledge cards [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages redeploy
        if: steps.git_push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
